title: EFAI-RD.md
description: Medical AI knowledge library — VLM / LLM papers, basics, and industry watch

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag

markdown: kramdown

# 白底淺色，不提供深色切換
color_scheme: light

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  button: false

heading_anchors: true
back_to_top: true
back_to_top_text: "回到頂端"

aux_links:
  "GitHub":
    - "https://github.com/EFAI-RD/EFAI-RD.md"
aux_links_new_tab: true

footer_content: "EFAI-RD 醫療 AI 知識書庫。每篇文末 References 可點回原始來源。"
